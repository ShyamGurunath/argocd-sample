apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiny-web-ui
  namespace: jacob
  labels:
    app: tiny-web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiny-web-ui
  template:
    metadata:
      labels:
        app: tiny-web-ui
    spec:
      containers:
      - name: web-server
        image: nginxdemos/hello:plain-text
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: tiny-web-ui-service
  namespace: jacob
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: tiny-web-ui
